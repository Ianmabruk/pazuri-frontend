services:
  - type: web
    name: pazuri-backend
    runtime: python
    rootDir: pazurifishcom/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pazuri-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
